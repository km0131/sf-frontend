server {
    listen 80;
    root /usr/share/nginx/html;

    # ビルド済みの JS・CSS はファイル名にハッシュが入るので長くキャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React の画面遷移（/s/hiroshimayaki/pos など）はすべて index.html を返す
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
