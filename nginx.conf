server {
    listen 80;
    root /usr/share/nginx/html;

    # セキュリティヘッダーは dist/_headers（Cloudflare Workers 用）から Dockerfile で生成する。
    # location 内で add_header を使うと外側の add_header は無視されるので、各 location で読み込む。

    # ビルド済みの JS・CSS・フォントはファイル名にハッシュが入るので長くキャッシュしてよい
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React の画面遷移（/s/hiroshimayaki/pos など）はすべて index.html を返す
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
