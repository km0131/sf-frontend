services:
  # 開発サーバー（Vite）。ソースをマウントしているので、保存するとブラウザに即反映される
  web:
    build:
      context: .
      target: dev
    container_name: sf-frontend
    restart: unless-stopped
    environment:
      # ブラウザから見た API の URL（バックエンドの compose で公開しているポート）
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-15173}:5173"
    volumes:
      - .:/app
      # node_modules はコンテナ内のものを使う（ホストの node_modules で上書きしない）
      - node_modules:/app/node_modules

  # 本番ビルドの確認用。docker compose --profile preview up preview で起動
  preview:
    profiles: ["preview"]
    build:
      context: .
      target: preview
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: sf-frontend-preview
    ports:
      - "${PREVIEW_HOST_PORT:-14173}:80"

volumes:
  node_modules:
